  - num: 17
    week: 9
    unit: U4
    code: L17
    slug: 17-risk-response
    title: "Risk Responses, Issues & Reserves"
    tagline: Strategies for threats and opportunities, and who owns each one.
    clo: [CLO4]
    bloom: Evaluate
    cases: [CS-23]
    tools: [response planning sheet]
    topics:
      - title: Threat strategies
        bullets:
