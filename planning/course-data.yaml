        bullets:
          - In/out lists, deliverable-oriented thinking, acceptance criteria
      - title: WBS construction
        bullets:
          - 100% rule; decomposition depth; work packages as control points
          - WBS dictionary entries
      - title: Scope creep vs gold plating
        bullets:
          - Detection heuristics and control mechanisms
    activities: ["Build a 3-level WBS for a student-information portal", "Scope-creep spotting drill on a change-request log"]
    assessment: null

  - num: 10
    week: 5
    unit: U3
    code: L10
    slug: 10-estimation
    title: "Estimation: Size, Effort, Duration"
    tagline: Point estimates lie; distributions and ranges tell the truth.
    clo: [CLO2]
    bloom: Apply
    cases: [CS-14]
    tools: [planning poker, three-point sheet]
    topics:
      - title: Estimation approaches
        bullets:
          - Expert judgment, analogous, parametric, bottom-up, three-point
          - PERT weighting (O+4M+P)/6 and why it works
      - title: Software estimation families
        bullets:
          - Story points & velocity; function points (concept); COCOMO awareness
          - Estimate vs target vs commitment
      - title: Common failure modes
        bullets:
          - Anchor bias, padding, planning fallacy; calibration practice
    activities: ["Planning poker on 8 capstone backlog items", "Convert team estimates to PERT distributions"]
    assessment: null

  - num: 11
    week: 6
    unit: U3
    code: L11
    slug: 11-cpm-pert
    title: "Network Logic, CPM & PERT"
    tagline: Find the critical path before it finds you.
    clo: [CLO2]
    bloom: Apply
    cases: [CS-15]
    tools: [network diagrams]
