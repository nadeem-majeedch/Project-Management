      - title: Critical Path Method
        bullets:
          - Forward/backward pass; ES, EF, LS, LF; total & free float
      - title: Compression decisions
        bullets:
          - Crashing (cost trade-off) vs fast-tracking (risk trade-off)
    activities: ["Solve a 14-activity network by hand", "Crash a network under a budget constraint"]
    assessment: null

  - num: 12
    week: 6
    unit: U3
    code: L12
    slug: 12-schedule-tools
    title: "Schedules, Gantt Charts & Resource Levelling"
    tagline: From network logic to a working, resource-feasible schedule.
    clo: [CLO2]
    bloom: Apply
    cases: [CS-16]
    tools: [Gantt (draw.io / open tool)]
