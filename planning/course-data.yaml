# ==============================================================================
# Project Management — Course Data (Single Source of Truth)
# ==============================================================================
# Audience : 7th-semester BS Computer Science & BS Data Science students
# Instructor: Dr. Muhammad Nadeem Majeed
# Structure : 16 weeks x 2 lectures/week x 2 hours = 32 lectures, 64 hours
#
# Every planning artifact (curriculum map, schedule, CLO map, case catalog,
# lecture skeletons) is GENERATED from this file by tools/scaffold.py.
# Edit here, regenerate — never hand-edit generated files.
#
# Per-lecture schema:
#   num      — lecture number 1..32
#   week     — teaching week 1..16
#   unit     — course unit (U1..U7)
#   code     — short code used in schedules (L01..L32)
#   slug     — file name stem under docs/lectures/
#   title    — lecture title
#   tagline  — one-line summary for the curriculum map
#   clo      — CLOs covered (list of CLO1..CLO6)
#   bloom    — highest Bloom level targeted (Remember..Create)
#   cases    — case-study cluster referenced by the lecture
#   tools    — named tools/frameworks exercised (informational)
#   topics   — ordered content blocks: title + bullet points
#   activities — in-class activities (2-hour session plan anchors)
#   assessment — assessment component anchored at this lecture (or null)
# ==============================================================================

course:
  code: PM-401
  title: Project Management
  level: Semester 7
  programs: [BS Computer Science, BS Data Science]
  credits: 3+1
  contact_hours: 64
  lecture_hours: 32
  lecture_length_hours: 2
  duration_weeks: 16
  instructor: Dr. Muhammad Nadeem Majeed
  version: "1.0"
  last_reviewed: 2026-09-19

standards:
  pmBok: "PMBOK Guide, 7th Edition (PMI, 2021) — 12 principles, 8 performance domains"
  pmp: "PMP Exam Content Outline (PMI, 2021) — domains: People (42%), Process (50%), Business Environment (8%)"
  pmbok6_reference: "PMBOK Guide, 6th Edition (PMI, 2017) — retained for 49-process and ITTO vocabulary"
  iso21502: "ISO 21502:2020 — Guidance on project management"
  iso31000: "ISO 31000:2018 — Risk management guidelines"
  agile: "Agile Manifesto (2001); Scrum Guide 2020 (Schwaber & Sutherland)"
  pmbok8: "PMBOK Guide, 8th Edition (PMI, 2025) — cited where publicly documented; verify before publication"

clos:
  - id: CLO1
    statement: >-
      Given a PMBOK 7 performance-domain map, define and correctly classify
      the twelve principles, the eight performance domains, and predictive,
      adaptive, and hybrid life-cycle models; given a project vignette, justify
      a life-cycle choice using at least three explicit criteria (requirements
      volatility, regulatory exposure, feedback cadence, team distribution).
    bloom: Understand
    assessment: Midterm, quizzes
    lectures: [1, 2, 3, 4, 5, 6, 8]
  - id: CLO2
    statement: >-
      Given a project brief, construct a deliverable-oriented WBS that passes
      the 100% rule, derive three-point (PERT) estimates for its work
      packages, build a CPM network with correctly computed float, and produce
      a levelled, time-feasible Gantt baseline within a fixed window.
    bloom: Apply
    assessment: Assignment 1, Labs 1-4, Midterm
    lectures: [6, 9, 10, 11, 12]
  - id: CLO3
    statement: >-
      Given activity cost data, develop a bottom-up budget with S-curve and a
      quality/data-quality plan containing at least four measurable metrics
      and eight enforceable data-quality rules; given PV, EV, and AC, compute
      the full earned-value set (CV, SV, CPI, SPI, EAC variants, TCPI)
      correctly.
    bloom: Apply
    assessment: Midterm (primary); practiced via CS-17, CS-26, CS-57, CS-62 and capstone budget
    lectures: [13, 14, 18]
  - id: CLO4
    statement: >-
      Given a project scenario, identify at least eighteen distinct risks as
      normalized cause-risk-effect statements, quantify at least one risk via
      EMV or Monte Carlo simulation, and propose responses with named owners,
      triggers, and residual risk; given PV/EV/AC data, diagnose project
      health and recommend a justified recovery action.
    bloom: Analyze/Evaluate
    assessment: Assignment 3, Labs 7-8, Midterm, Capstone checkpoint
    lectures: [15, 16, 17, 18, 19, 20]
  - id: CLO5
    statement: >-
      Given a delivery context, operate Scrum, Kanban, and hybrid flow
      systems: produce a sprint plan with a single-sentence goal and capacity
      check, set WIP limits justified by flow metrics, rewrite a feature-first
      backlog into a hypothesis-driven one for a data/ML project, and prepare
      a working agreement plus a BATNA-based negotiation plan for a sponsor
      conflict.
    bloom: Apply
    assessment: Assignment 4, Labs 9-12, Case portfolio, Capstone
    lectures: [5, 7, 8, 21, 22, 23, 24, 25, 26]
  - id: CLO6
    statement: >-
      Given a project brief, design a complete, internally consistent project
      management plan (scope, schedule, and cost baselines plus risk,
      communication, quality, and data-governance plans), then defend its
      trade-offs — tailoring cuts, risk investments, ethics and AI-use
      positions — in a rubric-scored oral defense with follow-up questions.
    bloom: Create
    assessment: Capstone, Final exam, Case portfolio
    lectures: [27, 28, 29, 30, 31, 32]

# Knowledge areas (PMBOK/ISO vocabulary) mapped to CLOs and carrying lectures.
# Used by docs/syllabus/detailed-syllabus.md and checked by tools/validate.py gate 9:
# every area must touch >=1 lecture; every lecture must touch >=1 area.
knowledge_areas:
  - id: KA-METHODS
    title: Predictive, Agile & Hybrid Methods
    clos: [CLO1, CLO5]
    lectures: [5, 8, 21, 22, 23, 24]
    description: >-
      Choosing and operating the delivery approach: predictive phases,
      Scrum/Kanban mechanics, hybrid wrappers for regulated or platform work.
  - id: KA-GOVERNANCE
    title: Project Initiation & Governance
    clos: [CLO1, CLO6]
    lectures: [1, 2, 3, 6, 28]
    description: >-
      Portfolio alignment, charter authority, stage gates, decision rights,
      steering structures (ISO 21502 vocabulary).
  - id: KA-SCOPE
    title: Scope Management
    clos: [CLO2]
    lectures: [9, 27]
    description: Scope statements, WBS, acceptance criteria, creep control.
  - id: KA-SCHEDULE
    title: Schedule Management
    clos: [CLO2]
    lectures: [10, 11, 12, 27]
    description: Estimation, CPM/PERT, compression, levelling, baselining.
  - id: KA-COST
    title: Cost Management
    clos: [CLO3]
    lectures: [13, 16, 27]
    description: Estimating, budgeting, S-curve, contingency, cloud-cost realities.
  - id: KA-QUALITY
    title: Quality & Data Quality
    clos: [CLO3]
    lectures: [14, 27]
    description: Quality planning, metrics, verification vs validation, data-quality rules.
  - id: KA-RESOURCES
    title: Resource & Team Management
    clos: [CLO2, CLO5]
    lectures: [4, 12, 25]
    description: RACI, capacity, levelling, team development and motivation.
  - id: KA-RISK
    title: Risk & Uncertainty
    clos: [CLO4]
    lectures: [15, 16, 17, 18, 27]
    description: ISO 31000 process, qualification, quantification, responses, reserves.
  - id: KA-COMMS
    title: Communications & Stakeholders
    clos: [CLO5]
    lectures: [7, 26, 27]
    description: Identification, engagement planning, matrices, negotiation, bad news.
  - id: KA-PROCUREMENT
    title: Procurement
    clos: [CLO3]
    lectures: [18]
    description: Make-or-buy, contract types, SLAs, vendor lifecycle.
  - id: KA-CONTROL
    title: Monitoring, Change Control & Closure
    clos: [CLO4, CLO6]
    lectures: [19, 20, 30, 32]
    description: EVM, dashboards, integrated change control, closure discipline.
  - id: KA-LEADERSHIP
    title: Team Leadership & Professional Ethics
    clos: [CLO5, CLO6]
    lectures: [25, 26, 28]
    description: Team development, psychological safety, conflict, PMI Code values.
  - id: KA-DATA-AI
    title: Data Governance & Responsible AI
    clos: [CLO3, CLO4, CLO6]
    lectures: [14, 23, 28, 29, 31]
    description: >-
      Data-quality gates and stewardship, model risk gates and fairness
      thresholds, privacy and bias ethics, AI-assisted PM with verification
      duties and disclosure norms.
  - id: KA-SUSTAIN
    title: Sustainability & Benefits Realization
    clos: [CLO6]
    lectures: [29, 30]
    description: Compute footprint, benefit maps, operations handover.

units:
  - id: U1
    title: Foundations & Strategy
    weeks: [1, 2]
    lectures: [1, 2, 3, 4]
    description: >-
      Why projects fail; strategic alignment; project, program, portfolio;
      PMBOK 7 principles and performance domains; roles and the PM profession.
  - id: U2
    title: Life Cycles & Initiating
    weeks: [3, 4]
    lectures: [5, 6, 7, 8]
    description: >-
      Predictive, agile, hybrid life cycles; charter and stakeholder analysis;
      agile role system; tailoring for software and data projects.
  - id: U3
    title: Planning the Work
    weeks: [5, 6, 7]
    lectures: [9, 10, 11, 12, 13, 14]
    description: >-
      Scope and WBS; estimation; CPM/PERT scheduling; cost, budget, quality,
      and data-quality planning.
  - id: U4
    title: Risk, Uncertainty & Control
    weeks: [8, 9, 10]
    lectures: [15, 16, 17, 18, 19, 20]
    description: >-
      Risk management aligned to ISO 31000; PERT and simulation; procurement;
      EVM and adaptive monitoring; change control.
  - id: U5
    title: Adaptive Delivery & Teams
    weeks: [11, 12, 13]
    lectures: [21, 22, 23, 24, 25, 26]
    description: >-
      Scrum, Kanban, SAFe overview, hybrid; team performance; stakeholder
      communication and negotiation; data-specific team topologies.
  - id: U6
    title: Integration, Ethics & Closing
    weeks: [14, 15]
    lectures: [27, 28, 29, 30]
    description: >-
      Master planning; ethics and professional responsibility (PMI Code);
      sustainability; closure, lessons learned, benefits realization.
  - id: U7
    title: Synthesis & Capstone
    weeks: [16]
    lectures: [31, 32]
    description: >-
      AI-assisted project management; capstone defense and course synthesis.

lectures:
  # ── Unit 1: Foundations & Strategy ─────────────────────────────────────────
  - num: 1
    week: 1
    unit: U1
    code: L01
    slug: 01-why-projects-fail
    title: "Why Projects Fail: The Case for Project Management"
    tagline: Failure statistics, the iron triangle, and what disciplined management changes.
    clo: [CLO1]
    bloom: Understand
    cases: [CS-01, CS-02]
    tools: [none]
    topics:
      - title: The project landscape in software & data
        bullets:
          - Project success/failure patterns in the software industry
          - Famous failures vs famous successes; what the differences trace back to
      - title: The iron triangle and its limits
        bullets:
          - Scope, time, cost, and quality as competing constraints
          - Why the triangle alone does not explain failure
      - title: What a project manager actually does
        bullets:
          - From 'note-taker' to integrator of scope, risk, and stakeholders
          - Value of method vs value of judgment
    activities: ["Failure autopsy: small groups map a well-known failure onto the iron triangle", "Baseline quiz: what would you have done first?"]
    assessment: null

  - num: 2
    week: 1
    unit: U1
    code: L02
    slug: 02-strategy-portfolio
    title: "Strategy, Portfolios, Programs & Projects"
    tagline: How organizations select the right projects before running them well.
    clo: [CLO1]
    bloom: Understand
    cases: [CS-03]
    tools: [value scorecards]
    topics:
      - title: Portfolio, program, project, and operations
        bullets:
          - Definitions and boundaries (PMBOK 7 vocabulary)
          - Why portfolio selection mistakes dwarf execution mistakes
      - title: Strategic alignment mechanisms
        bullets:
          - Benefits realization as the bridge from strategy to delivery
          - Stage gates and go/no-go criteria
      - title: Selecting projects
        bullets:
          - Weighted scoring, NPV/payback intuition for technical audiences
          - Balance across risk horizons
    activities: ["Score 6 candidate projects with a weighted matrix; defend the cut line", "Map one real company's portfolio to its strategy"]
    assessment: null

  - num: 3
    week: 2
    unit: U1
    code: L03
    slug: 03-pmbok7-principles-domains
    title: "PMBOK Guide 7: Principles & Performance Domains"
    tagline: The 12 principles and 8 performance domains as the course's backbone.
    clo: [CLO1]
    bloom: Understand
    cases: [CS-04]
    tools: [PMBOK 7 map]
    topics:
      - title: From processes to principles
        bullets:
          - Why PMI moved from 49 processes (PMBOK 6) to 12 principles (PMBOK 7)
          - Principle groups — stewardship, team, stakeholders, value, systems thinking, leadership, tailoring, quality, complexity, risk, adaptability, resilience
      - title: The 8 performance domains
        bullets:
          - Stakeholders, team, development approach & life cycle, planning, project work, delivery, measurement, uncertainty
          - How domains interact on a real project
      - title: Models, methods, artifacts
        bullets:
          - PMBOK 7's 'choose your tools' stance and what it means for tailoring
    activities: ["Domain-mapping drill: place 20 real artifacts into the 8 domains", "Principle-to-failure tracing using lecture 1 cases"]
    assessment: null

  - num: 4
    week: 2
    unit: U1
    code: L04
    slug: 04-roles-profession
    title: "Roles, Competencies & the PM Profession"
    tagline: Who does what — sponsor, PM, product owner, scrum master — and what competence means.
    clo: [CLO1]
    bloom: Remember
    cases: [CS-05]
    tools: [PMI Talent Triangle]
    topics:
      - title: Role anatomy on technical projects
        bullets:
          - Sponsor, PM, product owner, scrum master, tech lead, data lead, SM
          - RACI for a typical software project
      - title: Competence frameworks
        bullets:
          - PMI Talent Triangle — ways of working, power skills, business acumen
          - Technical vs leadership vs strategic competence
      - title: Certification landscape
        bullets:
          - CAPM, PMP, PMI-ACP, PMI-PBA — what each signals
    activities: ["RACI workshop for a campus app project", "Talent-triangle self-assessment"]
    assessment: Quiz 1 (L01-L04)

  # ── Unit 2: Life Cycles & Initiating ───────────────────────────────────────
  - num: 5
    week: 3
    unit: U2
    code: L05
    slug: 05-lifecycles
    title: "Life Cycles: Predictive, Adaptive, Hybrid"
    tagline: Choosing the development approach before choosing any tool.
    clo: [CLO1, CLO5]
    bloom: Understand
    cases: [CS-06, CS-07]
    tools: [Stacey matrix]
    topics:
      - title: Life-cycle spectrum
        bullets:
          - Predictive (waterfall), iterative, incremental, adaptive, hybrid
          - When requirements uncertainty chooses the approach for you
      - title: Decision aids
        bullets:
          - Stacey matrix; requirements volatility; regulatory constraints
          - Data projects vs software projects vs platform projects
      - title: Sequencing and flow
        bullets:
          - Phase gates vs sprints vs continuous flow
    activities: ["Pick the life cycle for 5 project vignettes and defend it", "Volatility assessment of a capstone-style project"]
    assessment: null

  - num: 6
    week: 3
    unit: U2
    code: L06
    slug: 06-charter
    title: "Project Charter & Business Case"
    tagline: The two documents that authorize and justify everything that follows.
    clo: [CLO1, CLO2]
    bloom: Apply
    cases: [CS-08]
    tools: [canvas templates]
    topics:
      - title: Business case essentials
        bullets:
          - Problem, options, benefits, costs, risks; do-nothing baseline
          - SMART benefit statements for data projects
      - title: Project charter
        bullets:
          - Authority, objectives, high-level scope, milestones, sponsor signature
          - Charter anti-patterns (vague objectives, unowned assumptions)
      - title: From case to charter
        bullets:
          - Traceability from benefits to objectives to success criteria
    activities: ["Write a one-page charter for a familiar campus system", "Peer-review charters against a 10-point checklist"]
    assessment: null

  - num: 7
    week: 4
    unit: U2
    code: L07
    slug: 07-stakeholders
    title: "Stakeholder Identification & Analysis"
    tagline: Mapping everyone who can help or hurt the project — early.
    clo: [CLO5]
    bloom: Apply
    cases: [CS-09, CS-10]
    tools: [power-interest grid]
    topics:
      - title: Identification techniques
        bullets:
          - Brainstorming, org-chart crawling, data-lineage tracing for data projects
          - Hidden stakeholders in analytics and ML systems (auditors, data owners)
      - title: Analysis & prioritization
        bullets:
          - Power/interest, influence/impact, salience models
          - Engagement assessment matrix (unaware → leading)
      - title: Stakeholder register
        bullets:
          - What to record; when to refresh it
    activities: ["Stakeholder hunt on a hospital analytics project vignette", "Build a power/interest grid; plan engagement for 3 hostile stakeholders"]
    assessment: null

  - num: 8
    week: 4
    unit: U2
    code: L08
    slug: 08-tailoring
    title: "Tailoring for Software & Data Projects"
    tagline: No template survives contact with your project — tailor deliberately.
    clo: [CLO1, CLO5]
    bloom: Apply
    cases: [CS-11]
    tools: [tailoring worksheets]
    topics:
      - title: Tailoring logic
        bullets:
          - Project size, criticality, regulatory exposure, team distribution
          - What to scale down (documents) vs never scale down (risk, quality)
      - title: Software-project tailoring
        bullets:
          - Startup vs enterprise vs regulated (health/finance) contexts
      - title: Data-project tailoring
        bullets:
          - Data availability risk; model-uncertainty milestones; experiment-driven planning
    activities: ["Tailor a heavyweight template down to a 6-week student project", "Compare two real tailoring decisions and their consequences"]
    assessment: null

  # ── Unit 3: Planning the Work ──────────────────────────────────────────────
  - num: 9
    week: 5
    unit: U3
    code: L09
    slug: 09-scope-wbs
    title: "Scope & Work Breakdown Structure"
    tagline: If it is not in the WBS, it is not in the project.
