  - id: CS-16
    title: "Gantt baseline and resource levelling"
    domain: D3
    level: L2
    use: [in-class]
    lecture: 12
    seed: CAMPUSHUB
    difficulty: beginner
    numerical: false
    tags: [Gantt, baseline, resource-levelling, scheduling]
    concepts: [Gantt chart, resource levelling]
    summary: "Build a Gantt baseline and level a resource conflict without moving the critical path."
    context: "Two activities need the same database specialist in the same fortnight. One has 4 days of float, the other is critical. A third task could shift into the gap but belongs to a different deliverable."
    problem: "Produce a baseline Gantt, then level the conflict without extending the project end date."
    constraints:
      - "The critical path may not lengthen."
      - "The specialist's total workload may not exceed capacity in any week."
      - "Cross-deliverable moves need a one-line justification."
    tasks:
      - "Draw the baseline Gantt with the conflict visible."
      - "Apply levelling within float and show the revised bars."
      - "State what the levelling consumed (float) and the new risk exposure."
    deliverables:
      - "Before/after Gantt."
      - "Float-consumption note."
    discussion:
      - "What does 'levelling within float' cost the project even when the end date holds?"
      - "When is hiring/loaning a second specialist better than levelling?"
    objectives:
      - "Use float as the levelling budget."
      - "Recognize that a stable end date can still hide risk transfer."
    rubric: "Conflict resolved without critical-path extension (40%); float consumption quantified (30%); risk-transfer note is honest (30%)."
    solution:
      model: "Float-bounded levelling"
      reasoning: "Move the floated activity into its 4-day float window; the specialist's conflict resolves without touching the critical path. The cost: the floated activity now has zero float — any further slip makes it critical, so the project's resilience decreased even though the end date is unchanged. The cross-deliverable move is justified only if the receiving deliverable's float can absorb it; otherwise it just relocates the conflict."
      alternatives:
        - "Splitting the specialist's time 50/50: defensible if context-switching cost is low; usually it is not for deep technical work."
        - "Requesting a second specialist: costs money, preserves float — the right call when float is nearly exhausted elsewhere."
      lesson_for_instructor: "Make students state the new float of the moved activity; 'it fit' is not an answer."

  - id: CS-17
    title: "Bottom-up budget for a data project"
    domain: D4
    level: L3
    use: [in-class]
    lecture: 13
    seed: GRIDSENSE
    difficulty: beginner
    numerical: true
    tags: [budget, bottom-up, contingency, management-reserve, cost-baseline]
    concepts: [cost baseline, contingency, management reserve]
    summary: "Build a bottom-up budget for a data project from labor, indirects, and direct costs."
    context: "GridSense's ingestion-layer upgrade: three roles with rates, a cloud direct cost, a 25% indirect rate on labor, 10% contingency on the subtotal, and a 5% management reserve on top."
    problem: "Assemble the cost baseline from the components and reconcile it against the funding cap."
    constraints:
      - "Contingency applies to the subtotal; management reserve applies on top of contingency."
      - "The funding cap is fixed; the budget must fit under it."
    tasks:
      - "Compute labor by role (hours × rate), indirects, and direct costs."
      - "Apply contingency and management reserve in the stated order."
      - "Reconcile against the cap and state the headroom or overrun."
    deliverables:
      - "Budget build-up table."
      - "Cap reconciliation with headroom/overrun."
    discussion:
      - "Who controls contingency versus management reserve, and why does the distinction matter?"
      - "What does it mean if contingency is spent but the schedule is fine?"
    objectives:
      - "Assemble a cost baseline with correct reserve layering."
      - "Reconcile budget against funding constraints."
    rubric: "Build-up arithmetic correct (50%); reserve layering order correct (30%); reconciliation conclusion correct (20%)."
    solution:
      model: "Layered cost build-up"
      reasoning: "Labor = Σ(hours × rate). Indirects = 25% × labor. Subtotal = labor + indirects + direct. Contingency = 10% × subtotal (PM-controlled, known-unknowns). Management reserve = 5% × (subtotal + contingency) (sponsor-controlled, unknown-unknowns). Baseline = subtotal + contingency; the reserve sits above the baseline and is released only through the sponsor. Headroom = cap − total including reserve."
      alternatives: []
      calculations: "Worked build-up in instructor key; machine-checked."
      lesson_for_instructor: "Quiz the control boundary: who spends contingency vs reserve — it is a governance question wearing arithmetic clothes."
    numeric:
      type: budget
      note: "Labor roll-up, indirects, contingency, management reserve, cap reconciliation."
      data:
        roles:
          - {role: "Data engineer",      hours: 420, rate_pkr: 2600}
          - {role: "Backend engineer",   hours: 300, rate_pkr: 2400}
          - {role: "QA engineer",        hours: 160, rate_pkr: 1800}
        indirect_rate: 0.25
        direct_costs_pkr: 180000
        contingency_rate: 0.10
        mgmt_reserve_rate: 0.05
        funding_cap_pkr: 3000000
      expected:
        labor_pkr: 2100000
        indirects_pkr: 525000
        subtotal_pkr: 2805000
        contingency_pkr: 280500
        baseline_pkr: 3085500
        mgmt_reserve_pkr: 154275
        total_with_reserve_pkr: 3239775
        cap_headroom_pkr: -239775

  - id: CS-18
    title: "Quality metrics for a registration system"
    domain: D6
    level: L1
    use: [in-class]
    lecture: 14
    seed: CAMPUSHUB
    difficulty: beginner
    numerical: false
    tags: [quality, metrics, cost-of-quality, verification]
    concepts: [quality metrics, cost of quality]
    summary: "Choose four quality metrics for a registration system and defend the choice against vanity metrics."
    context: "A registration system rebuild wants 'quality' metrics for its dashboard. Candidates offered: lines of code, test pass rate, defect count, escaped defects per release, code review coverage, user-reported issues per month."
    problem: "Select four metrics that actually measure quality outcomes and reject the vanity ones with reasons."
    constraints:
      - "Each kept metric needs: what it measures, how collected, what decision it informs."
      - "Each rejected metric needs the specific way it misleads."
    tasks:
      - "Select four metrics with the three-part justification."
      - "Reject the others with named failure modes."
      - "Set one target per kept metric and say where the target came from."
    deliverables:
      - "Keep/reject table with justifications."
      - "Targets with provenance."
    discussion:
      - "Why is test pass rate almost meaningless without knowing what the tests cover?"
      - "What's the cost of collecting a metric nobody uses?"
    objectives:
      - "Distinguish outcome metrics from activity metrics."
      - "Tie every metric to a decision."
    rubric: "Kept metrics are decision-linked (50%); rejections name real failure modes (30%); targets have provenance (20%)."
    solution:
      model: "Decision-linked metric selection"
      reasoning: "Keep: escaped defects per release (outcomes users feel), defect count by severity trend (in-process signal), user-reported issues per month (post-release truth), code review coverage (process guardrail with a decision: what merge gate applies). Reject: lines of code (measures effort, not quality; rewards verbosity), test pass rate without coverage context (a green suite over 20% coverage says nothing). Targets come from the legacy system's baseline, not industry folklore."
      alternatives: []
      lesson_for_instructor: "Ask who would act differently on each kept metric — if nobody, it's decoration."

  - id: CS-19
    title: "Eight data-quality rules for a customer dataset"
    domain: D6
    level: L2
    use: [in-class, homework]
    lecture: 14
    seed: TELCOCARE
    difficulty: beginner
    numerical: false
    tags: [data-quality, validation-rules, profiling, DS-projects]
    concepts: [data quality dimensions, validation rules]
    summary: "Write eight executable data-quality rules for a customer dataset spanning six dimensions."
    context: "A churn-model team receives a customer extract: 2.1M rows, 47 columns, five source systems merged. Known symptoms: duplicate customers with different IDs, 3% missing tenure, region codes from two eras, dates of birth in the future for 400 rows."
    problem: "Specify eight validation rules covering completeness, uniqueness, validity, consistency, timeliness, and accuracy."
    constraints:
      - "At least six dimensions must appear among the eight rules."
      - "Each rule must be specific enough to implement as code."
      - "For each rule: the action when it fails (reject, repair, flag)."
    tasks:
      - "Write eight rules with dimension, logic, threshold, and failure action."
      - "Order the rules as an execution pipeline and justify the order."
      - "State which rule's failure would block the project, not just the batch."
    deliverables:
      - "Rule specification table."
      - "Pipeline order with rationale."
      - "Blocking-rule call with reasoning."
    discussion:
      - "Which dimension is hardest to automate, and why is accuracy different from validity?"
      - "Who owns a rule that fails — the data team or the source system's owner?"
    objectives:
      - "Specify data-quality rules across all six dimensions."
      - "Sequence validation as a pipeline with ownership."
    rubric: "Rules are implementable and cover six dimensions (50%); pipeline order justified (30%); blocking call argued (20%)."
    solution:
      model: "Dimensioned rule pipeline"
      reasoning: "Structural rules run first (schema, types), then uniqueness (dedupe before completeness, or you repair ghosts), then validity (format/domain checks), then consistency (cross-field), then timeliness (freshness), and accuracy last (needs reference comparison). The blocking rule: duplicate customers — every downstream metric is wrong if identity is wrong, so dedupe failure blocks the batch, while missing tenure (3%) can be flagged and imputed with disclosed assumptions."
      alternatives:
        - "Completeness before uniqueness: defensible when missing rows make dedupe cheaper; here duplicates with different IDs survive completeness checks, so uniqueness first."
      lesson_for_instructor: "Have students find the rule that can't be automated (accuracy usually needs sampling against ground truth)."

  - id: CS-20
    title: "Twenty risks for a streaming platform"
    domain: D5
    level: L2
    use: [in-class]
    lecture: 15
    seed: GRIDSENSE
    difficulty: beginner
    numerical: false
    tags: [risk-identification, register, categories, streaming]
    concepts: [risk identification, risk register]
    summary: "Populate a risk register with 20 distinct risks for a streaming analytics platform across categories."
    context: "GridSense's platform upgrade faces technical (pipeline latency), external (vendor API changes), organizational (key-engineer departure), and data risks (sensor drift). Students must produce 20 distinct risks — no near-duplicates."
    problem: "Build a 20-risk register with category, cause, effect, and a detectability note per risk."
    constraints:
      - "No two risks may share the same cause-effect pair."
      - "Each risk: category, cause, effect, detectability (early/late/undetectable)."
      - "At least one risk must be an opportunity, not a threat."
    tasks:
      - "Draft 20 risks meeting the constraints."
      - "Mark the three risks a naive team would miss."
      - "Identify the risk with the worst detectability profile and why that matters."
    deliverables:
      - "20-row risk register."
      - "Missed-three note."
      - "Detectability call-out."
    discussion:
      - "Why is 'undetectable' the worst column to be in even for a low-impact risk?"
      - "How does an opportunity end up in a risk register legitimately?"
    objectives:
      - "Generate a broad, non-redundant risk set."
      - "Treat detectability as a first-class risk attribute."
    rubric: "Twenty distinct risks with full attributes (50%); missed-three are genuinely non-obvious (30%); detectability reasoning sound (20%)."
    solution:
      model: "Category-driven identification with detectability"
      reasoning: "Coverage strategy: force at least two risks per category (technical, external, organizational, data, operational, opportunity) to prevent clustering. The naive misses: sensor drift (slow, invisible until accuracy decays), key-person risk disguised as 'bus factor 1' on the pipeline DSL, and the opportunity — vendor API v2 offers cheaper ingestion but only if adopted mid-project. Worst detectability: sensor drift, because monitoring shows 'green' while accuracy silently decays; mitigation is reference-sensor comparison, not alerting."
      alternatives: []
      lesson_for_instructor: "Count category coverage live; the 20-risk constraint exists to force breadth, so enforce it."
